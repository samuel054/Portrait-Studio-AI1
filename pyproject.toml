[project]
name = "portrait-studio-ai"
version = "0.21.0"
description = "Identity-first portrait analysis and generation platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "opencv-python-headless>=4.11,<5.0",
  "numpy>=2.0,<3.0",
  "pillow>=11.0,<12.0",
  "pydantic-settings>=2.10,<3.0",
]

[project.optional-dependencies]
identity = [
  "insightface>=0.7.3,<0.8",
  "onnxruntime>=1.20,<2.0",
]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
